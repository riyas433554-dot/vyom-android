name: Vyom Android Debug

on:
  push:
    branches:
      - fresh-history/android-app-copy
      - feature/u1-live-orbit-tasks
      - feature/r1a-android-reliability
      - feature/r1-reliable-core
  pull_request:
    branches:
      - fresh-history/android-app-copy
  workflow_dispatch:

permissions:
  contents: read

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - name: Build and test unsigned debug APK
        env:
          ANDROID_VERSION_NAME: "0.3.0"
          ANDROID_VERSION_CODE: "3"
        run: gradle testDebugUnitTest assembleDebug --no-daemon
      - name: Package versioned APK and checksums
        shell: bash
        run: |
          set -euo pipefail
          SHORT_SHA="${GITHUB_SHA::7}"
          APK="vyom-0.3.0-${SHORT_SHA}.apk"
          mkdir -p output
          cp app/build/outputs/apk/debug/app-debug.apk "output/${APK}"
          sha256sum "output/${APK}" | tee "output/${APK}.sha256"
          printf 'versionName=0.3.0\nversionCode=3\ncommit=%s\n' "$SHORT_SHA" > output/build-info.txt
      - name: Upload unsigned debug APK
        uses: actions/upload-artifact@v4
        with:
          name: vyom-0.3.0-${{ github.sha }}
          path: output/*
          if-no-files-found: error
          retention-days: 30
