name: Vyom Android Debug

on:
  push:
    branches:
      - fresh-history/android-app-copy
      - feature/u1-live-orbit-tasks
      - feature/memory-intelligence
  pull_request:
    branches:
      - fresh-history/android-app-copy
  workflow_dispatch:

permissions:
  contents: read

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - name: Configure persistent release signing when repository secrets are available
        id: signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS || secrets.KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD || secrets.KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${ANDROID_KEYSTORE_BASE64:-}" && -z "${ANDROID_KEYSTORE_PASSWORD:-}" && -z "${ANDROID_KEY_ALIAS:-}" && -z "${ANDROID_KEY_PASSWORD:-}" ]]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "Persistent signing secrets are not configured; only the ephemeral debug APK will be built."
            exit 0
          fi
          test -n "${ANDROID_KEYSTORE_BASE64:-}" || { echo "Missing ANDROID_KEYSTORE_BASE64"; exit 1; }
          test -n "${ANDROID_KEYSTORE_PASSWORD:-}" || { echo "Missing ANDROID_KEYSTORE_PASSWORD"; exit 1; }
          test -n "${ANDROID_KEY_ALIAS:-}" || { echo "Missing ANDROID_KEY_ALIAS"; exit 1; }
          test -n "${ANDROID_KEY_PASSWORD:-}" || { echo "Missing ANDROID_KEY_PASSWORD"; exit 1; }
          ENCODED_KEYSTORE="$(printf '%s' "$ANDROID_KEYSTORE_BASE64" | tr -d '[:space:]' | tr '_-' '/+')"
          if [[ ! "$ENCODED_KEYSTORE" =~ ^[A-Za-z0-9+/]*={0,2}$ ]]; then
            echo "ANDROID_KEYSTORE_BASE64 contains non-base64 characters; secret value was not logged."
            exit 1
          fi
          ENCODED_LENGTH="$(printf '%s' "$ENCODED_KEYSTORE" | wc -c | tr -d ' ')"
          case $((ENCODED_LENGTH % 4)) in
            0) ;;
            2) ENCODED_KEYSTORE="${ENCODED_KEYSTORE}==" ;;
            3) ENCODED_KEYSTORE="${ENCODED_KEYSTORE}=" ;;
            1) echo "ANDROID_KEYSTORE_BASE64 has an invalid length; secret value was not logged."; exit 1 ;;
          esac
          printf '%s' "$ENCODED_KEYSTORE" | base64 --decode > "$RUNNER_TEMP/vyom-release.jks"
          test -s "$RUNNER_TEMP/vyom-release.jks" || { echo "Decoded keystore is empty"; exit 1; }
          keytool -list -keystore "$RUNNER_TEMP/vyom-release.jks" -storepass "$ANDROID_KEYSTORE_PASSWORD" -alias "$ANDROID_KEY_ALIAS" >/dev/null
          rm -f "$RUNNER_TEMP/vyom-key-check.csr"
          if keytool -certreq -alias "$ANDROID_KEY_ALIAS" -file "$RUNNER_TEMP/vyom-key-check.csr" -keystore "$RUNNER_TEMP/vyom-release.jks" -storepass "$ANDROID_KEYSTORE_PASSWORD" -keypass "$ANDROID_KEY_PASSWORD" >/dev/null 2>&1; then
            VERIFIED_KEY_PASSWORD="$ANDROID_KEY_PASSWORD"
            echo "Signing key password validated."
          else
            rm -f "$RUNNER_TEMP/vyom-key-check.csr"
            if keytool -certreq -alias "$ANDROID_KEY_ALIAS" -file "$RUNNER_TEMP/vyom-key-check.csr" -keystore "$RUNNER_TEMP/vyom-release.jks" -storepass "$ANDROID_KEYSTORE_PASSWORD" -keypass "$ANDROID_KEYSTORE_PASSWORD" >/dev/null 2>&1; then
              VERIFIED_KEY_PASSWORD="$ANDROID_KEYSTORE_PASSWORD"
              echo "Key password matches store password; using the verified store password for signing."
            else
              echo "ANDROID_KEY_PASSWORD does not unlock the selected keystore alias; update that repository secret."
              exit 1
            fi
          fi
          {
            printf 'ANDROID_KEYSTORE_PATH=%s\n' "$RUNNER_TEMP/vyom-release.jks"
            printf 'ANDROID_KEYSTORE_PASSWORD=%s\n' "$ANDROID_KEYSTORE_PASSWORD"
            printf 'ANDROID_KEY_ALIAS=%s\n' "$ANDROID_KEY_ALIAS"
            printf 'ANDROID_KEY_PASSWORD=%s\n' "$VERIFIED_KEY_PASSWORD"
          } >> "$GITHUB_ENV"
          echo "available=true" >> "$GITHUB_OUTPUT"
      - name: Verify release signing environment for Gradle
        if: steps.signing.outputs.available == 'true'
        shell: bash
        run: |
          set -euo pipefail
          test -s "$ANDROID_KEYSTORE_PATH"
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          test -n "$ANDROID_KEY_ALIAS"
          test -n "$ANDROID_KEY_PASSWORD"
          keytool -list -keystore "$ANDROID_KEYSTORE_PATH" -storepass "$ANDROID_KEYSTORE_PASSWORD" -alias "$ANDROID_KEY_ALIAS" >/dev/null
          keytool -certreq -alias "$ANDROID_KEY_ALIAS" -file "$RUNNER_TEMP/vyom-gradle-env-check.csr" -keystore "$ANDROID_KEYSTORE_PATH" -storepass "$ANDROID_KEYSTORE_PASSWORD" -keypass "$ANDROID_KEY_PASSWORD" >/dev/null
          rm -f "$RUNNER_TEMP/vyom-gradle-env-check.csr"
      - name: Build and test APKs
        env:
          ANDROID_VERSION_NAME: "0.3.1"
          ANDROID_VERSION_CODE: "4"
        run: |
          set -euo pipefail
          gradle testDebugUnitTest assembleDebug --no-daemon
          if [[ "${{ steps.signing.outputs.available }}" == "true" ]]; then
            gradle assembleRelease --no-daemon
          fi
      - name: Package versioned APKs and checksums
        shell: bash
        env:
          SIGNING_AVAILABLE: ${{ steps.signing.outputs.available }}
        run: |
          set -euo pipefail
          SHORT_SHA="${GITHUB_SHA::7}"
          mkdir -p output
          DEBUG_APK="vyom-0.3.1-${SHORT_SHA}-debug.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "output/${DEBUG_APK}"
          (cd output && sha256sum "${DEBUG_APK}") > "output/${DEBUG_APK}.sha256"
          if [[ "$SIGNING_AVAILABLE" == "true" ]]; then
            RELEASE_APK="vyom-0.3.1-${SHORT_SHA}-signed.apk"
            cp app/build/outputs/apk/release/app-release.apk "output/${RELEASE_APK}"
            (cd output && sha256sum "${RELEASE_APK}") > "output/${RELEASE_APK}.sha256"
            SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
            APKSIGNER="$(find "$SDK_ROOT/build-tools" -type f -name apksigner 2>/dev/null | sort -V | tail -n 1)"
            test -n "$APKSIGNER" || { echo "apksigner not found in Android SDK build-tools"; exit 1; }
            "$APKSIGNER" verify --verbose --print-certs "output/${RELEASE_APK}" > "output/${RELEASE_APK}.certs.txt" 2>&1
            EXPECTED_CERT_SHA256="7a7564fca9c2a32b23dd520352a4e3aafe445621d2b99afa15407d2386699f0a"
            ACTUAL_CERT_SHA256="$(grep -i 'SHA-256' "output/${RELEASE_APK}.certs.txt" | grep -Eo '[[:xdigit:]]{64}' | head -n 1 | tr '[:upper:]' '[:lower:]')"
            if [[ ! "$ACTUAL_CERT_SHA256" =~ ^[a-f0-9]{64}$ ]]; then
              echo "Could not extract a valid SHA-256 signing certificate fingerprint."
              exit 1
            fi
            if [[ "$ACTUAL_CERT_SHA256" != "$EXPECTED_CERT_SHA256" ]]; then
              echo "Signing certificate mismatch. Expected $EXPECTED_CERT_SHA256; received $ACTUAL_CERT_SHA256. APK will not be published."
              exit 1
            fi
            CERT_SHA256="$ACTUAL_CERT_SHA256"
          else
            CERT_SHA256="not-built"
          fi
          printf 'versionName=0.3.1\nversionCode=4\ncommit=%s\nreleaseSigning=%s\ncertificateSha256=%s\n' "$SHORT_SHA" "${SIGNING_AVAILABLE:-false}" "$CERT_SHA256" > output/build-info.txt
      - name: Upload debug and signed APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: vyom-0.3.1-${{ github.sha }}
          path: output/*
          if-no-files-found: error
          retention-days: 30
