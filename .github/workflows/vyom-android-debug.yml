name: Vyom Android Debug

on:
  push:
    branches:
      - fresh-history/android-app-copy
      - feature/u1-live-orbit-tasks
      - feature/memory-intelligence
      - vyom-proposal-*
      - vyom-worker-*
      - fix/item7-progress-gates
      - feature/real-worker-model
      - feature/factory-item5-task-intelligence
      - fix/factory-five-issues
  pull_request:
    branches:
      - fresh-history/android-app-copy
      - feature/memory-intelligence
      - feature/factory-item5-task-intelligence
      - feature/real-worker-model
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vyom-android-debug-${{ github.ref }}
  cancel-in-progress: false

jobs:
  debug:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - name: Set CI version
        shell: bash
        run: |
          set -euo pipefail
          VERSION_CODE="$GITHUB_RUN_NUMBER"
          [[ "$VERSION_CODE" =~ ^[1-9][0-9]*$ ]] && (( VERSION_CODE <= 2100000000 )) || { echo "GITHUB_RUN_NUMBER is outside Android versionCode range"; exit 1; }
          echo "ANDROID_VERSION_NAME=0.3.1-ci.$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"
          echo "ANDROID_VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"
      - name: Build and test debug APK
        run: gradle testDebugUnitTest assembleDebug --no-daemon
      - name: Package debug APK and checksum
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p output
          APK="vyom-0.3.1-${GITHUB_SHA::7}-debug.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "output/$APK"
          (cd output && sha256sum "$APK") > "output/$APK.sha256"
          printf 'versionName=%s\nversionCode=%s\ncommit=%s\n' "$ANDROID_VERSION_NAME" "$ANDROID_VERSION_CODE" "$GITHUB_SHA" > output/build-info.txt
      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: vyom-debug-${{ github.sha }}
          path: output/*
          if-no-files-found: error
          retention-days: 30
