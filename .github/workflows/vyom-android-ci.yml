name: Vyom Android CI

on:
  push:
    branches:
      - feature/u1-live-orbit-tasks
      - feature/r1a-android-reliability
      - feature/r1-reliable-core
      - feature/r2-workspace-media
      - feature/r3-floating-bubble-assistant
      - vyom-proposal-*
  pull_request:
    branches:
      - feature/u1-live-orbit-tasks

permissions:
  contents: read

concurrency:
  group: vyom-android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  debug:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Block policy-critical files in self-change proposals
        if: (github.event_name == 'pull_request' && startsWith(github.head_ref, 'vyom-proposal-')) || (github.event_name == 'push' && startsWith(github.ref_name, 'vyom-proposal-'))
        shell: bash
        env:
          EVENT_BEFORE: ${{ github.event.before }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            base="$EVENT_BEFORE"
            if [[ "$base" =~ ^0+$ ]]; then
              git fetch origin "+refs/heads/feature/u1-live-orbit-tasks:refs/remotes/origin/feature/u1-live-orbit-tasks"
              base="origin/feature/u1-live-orbit-tasks"
            fi
          else
            git fetch origin "+refs/heads/${GITHUB_BASE_REF}:refs/remotes/origin/${GITHUB_BASE_REF}"
            base="origin/${GITHUB_BASE_REF}"
          fi
          if [[ "$base" =~ ^0+$ ]]; then
            echo "Cannot validate proposal diff against an empty base"
            exit 1
          fi
          changed="$(git diff --name-only "$base...HEAD")"
          printf '%s\n' "$changed"
          forbidden='^(MainActivity\.kt|ActionEngine\.kt|DeviceActionExecutor\.kt|VoiceForegroundService\.kt|VyomAccessibilityService\.kt|SelfModificationPolicy\.kt|SelfModificationClient\.kt)$'
          while IFS= read -r path; do
            [[ -z "$path" ]] && continue
            case "$path" in
              app/src/main/java/com/hermes/assistant/*.kt) ;;
              *)
                echo "Blocked non-Kotlin-source path in self-proposal: $path"
                exit 1
                ;;
            esac
            name="${path##*/}"
            lower_name="${name,,}"
            if [[ "$name" =~ $forbidden ]] ||
               [[ "$lower_name" == *policy* ]] ||
               [[ "$lower_name" == *audit* ]] ||
               [[ "$lower_name" == *kill* ]] ||
               [[ "$lower_name" == *control* ]] ||
               [[ "$lower_name" == *accessibilityservice* ]] ||
               [[ "$lower_name" == *deviceactionexecutor* ]] ||
               [[ "$lower_name" == *voiceforegroundservice* ]] ||
               [[ "$lower_name" == *selfmodification* ]]; then
              echo "Blocked policy-critical change in self-proposal: $path"
              exit 1
            fi
          done <<< "$changed"
      - name: Unit tests and debug APK
        run: gradle testDebugUnitTest assembleDebug --no-daemon
      - name: Package versioned APK and checksum
        shell: bash
        run: |
          mkdir -p output
          cp app/build/outputs/apk/debug/app-debug.apk "output/vyom-phase6-${GITHUB_SHA}.apk"
          sha256sum "output/vyom-phase6-${GITHUB_SHA}.apk" > "output/vyom-phase6-${GITHUB_SHA}.apk.sha256"
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: vyom-phase6-${{ github.sha }}
          path: output/*
          if-no-files-found: error
          retention-days: 30
