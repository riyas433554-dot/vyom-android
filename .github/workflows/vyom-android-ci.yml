name: Vyom Android CI

on:
  push:
    branches:
      - feature/u1-live-orbit-tasks
      - feature/memory-intelligence
      - vyom-proposal-*
      - vyom-worker-*
      - fix/item7-progress-gates
      - feature/real-worker-model
      - feature/factory-item5-task-intelligence
      - fix/factory-five-issues
  pull_request:
    branches:
      - feature/u1-live-orbit-tasks
      - feature/memory-intelligence
      - feature/factory-item5-task-intelligence
      - feature/real-worker-model

permissions:
  contents: read

concurrency:
  group: vyom-android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  debug:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment:
      name: vyom-release-signing
    env:
      HERMES_BASE_URL: ${{ vars.HERMES_BASE_URL }}
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify single fixed Android release identity source
        run: python3 tools/check_release_identity.py
      - name: Test content package builder
        run: python3 -m unittest discover -s tools -p 'test_*.py'
      - name: Validate Termux Factory adapter syntax
        run: |
          bash -n scripts/vyom-factory.sh
          bash -n scripts/vyom-complain
      - name: Test Termux Factory status, priority and complaint intake
        run: |
          bash scripts/test-vyom-factory-list.sh
          bash scripts/test-vyom-complain.sh
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - name: Validate persistent release signing identity
        shell: bash
        run: |
          set -euo pipefail
          test -n "${ANDROID_KEYSTORE_BASE64:-}" || { echo "Missing ANDROID_KEYSTORE_BASE64"; exit 1; }
          test -n "${ANDROID_KEYSTORE_PASSWORD:-}" || { echo "Missing ANDROID_KEYSTORE_PASSWORD"; exit 1; }
          test -n "${ANDROID_KEY_ALIAS:-}" || { echo "Missing ANDROID_KEY_ALIAS"; exit 1; }
          test -n "${ANDROID_KEY_PASSWORD:-}" || { echo "Missing ANDROID_KEY_PASSWORD"; exit 1; }
          ENCODED="$(printf '%s' "$ANDROID_KEYSTORE_BASE64" | tr -d '[:space:]' | tr '_-' '/+')"
          [[ "$ENCODED" =~ ^[A-Za-z0-9+/]*={0,2}$ ]] || { echo "Keystore base64 is malformed; secret value was not logged."; exit 1; }
          LENGTH="$(printf '%s' "$ENCODED" | wc -c | tr -d ' ')"
          case $((LENGTH % 4)) in
            0) ;;
            2) ENCODED="${ENCODED}==" ;;
            3) ENCODED="${ENCODED}=" ;;
            *) echo "Keystore base64 length is invalid; secret value was not logged."; exit 1 ;;
          esac
          KEYSTORE="$RUNNER_TEMP/vyom-release.jks"
          printf '%s' "$ENCODED" | base64 --decode > "$KEYSTORE"
          unset ENCODED
          test -s "$KEYSTORE" || { echo "Decoded keystore is empty"; exit 1; }
          keytool -list -keystore "$KEYSTORE" -storepass "$ANDROID_KEYSTORE_PASSWORD" -alias "$ANDROID_KEY_ALIAS" >/dev/null
          if keytool -certreq -alias "$ANDROID_KEY_ALIAS" -file "$RUNNER_TEMP/vyom-key-check.csr" -keystore "$KEYSTORE" -storepass "$ANDROID_KEYSTORE_PASSWORD" -keypass "$ANDROID_KEY_PASSWORD" >/dev/null 2>&1; then
            VERIFIED_KEY_PASSWORD="$ANDROID_KEY_PASSWORD"
          elif keytool -certreq -alias "$ANDROID_KEY_ALIAS" -file "$RUNNER_TEMP/vyom-key-check.csr" -keystore "$KEYSTORE" -storepass "$ANDROID_KEYSTORE_PASSWORD" -keypass "$ANDROID_KEYSTORE_PASSWORD" >/dev/null 2>&1; then
            VERIFIED_KEY_PASSWORD="$ANDROID_KEYSTORE_PASSWORD"
          else
            echo "Configured key password cannot unlock the alias; secret values were not logged."
            exit 1
          fi
          rm -f "$RUNNER_TEMP/vyom-key-check.csr"
          {
            printf 'ANDROID_KEYSTORE_PATH=%s\n' "$KEYSTORE"
            printf 'ANDROID_KEYSTORE_PASSWORD=%s\n' "$ANDROID_KEYSTORE_PASSWORD"
            printf 'ANDROID_KEY_ALIAS=%s\n' "$ANDROID_KEY_ALIAS"
            printf 'ANDROID_KEY_PASSWORD=%s\n' "$VERIFIED_KEY_PASSWORD"
          } >> "$GITHUB_ENV"
      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Go for full reachable history scan
        uses: actions/setup-go@v5
        with:
          go-version: "1.24.0"
      - name: Install pinned Gitleaks
        run: go install github.com/zricethezav/gitleaks/v8@v8.24.3
      - name: Full reachable Git history secret scan (redacted)
        shell: bash
        run: |
          set +e
          "$(go env GOPATH)/bin/gitleaks" git --redact --no-banner --log-opts="--all" --report-format=json --report-path=history-gitleaks.json .
          scan_status=$?
          set -e
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path("history-gitleaks.json")
          findings = json.loads(p.read_text()) if p.exists() and p.stat().st_size else []
          print(f"FULL_HISTORY_GITLEAKS_FINDINGS={len(findings)}")
          for item in findings:
              print(
                  "REDACTED_FINDING"
                  f" | rule={item.get('RuleID', 'unknown')}"
                  f" | file={item.get('File', 'unknown')}"
                  f" | line={item.get('StartLine', 'unknown')}"
                  f" | commit={item.get('Commit', 'unknown')}"
              )
          PY
          exit "$scan_status"
      - name: Upload redacted full-history secret report
        if: always() && hashFiles('history-gitleaks.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: redacted-full-history-gitleaks
          path: history-gitleaks.json
          if-no-files-found: error
          retention-days: 30
      - name: Block policy-critical files in self-change proposals
        if: (github.event_name == 'pull_request' && startsWith(github.head_ref, 'vyom-proposal-')) || (github.event_name == 'push' && startsWith(github.ref_name, 'vyom-proposal-'))
        shell: bash
        env:
          EVENT_BEFORE: ${{ github.event.before }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            base="$EVENT_BEFORE"
            if [[ "$base" =~ ^0+$ ]]; then
              git fetch origin "+refs/heads/feature/memory-intelligence:refs/remotes/origin/feature/memory-intelligence"
              base="origin/feature/memory-intelligence"
            fi
          else
            git fetch origin "+refs/heads/${GITHUB_BASE_REF}:refs/remotes/origin/${GITHUB_BASE_REF}"
            base="origin/${GITHUB_BASE_REF}"
          fi
          if [[ "$base" =~ ^0+$ ]]; then
            echo "Cannot validate proposal diff against an empty base"
            exit 1
          fi
          changed="$(git diff --name-only "$base...HEAD")"
          printf '%s\n' "$changed"
          forbidden='^(MainActivity\.kt|ActionEngine\.kt|DeviceActionExecutor\.kt|VoiceForegroundService\.kt|VyomAccessibilityService\.kt|SelfModificationPolicy\.kt|SelfModificationClient\.kt)$'
          while IFS= read -r path; do
            [[ -z "$path" ]] && continue
            case "$path" in
              app/src/main/java/com/hermes/assistant/*.kt) ;;
              *)
                echo "Blocked non-Kotlin-source path in self-proposal: $path"
                exit 1
                ;;
            esac
            name="${path##*/}"
            lower_name="${name,,}"
            if [[ "$name" =~ $forbidden ]] ||
               [[ "$lower_name" == *policy* ]] ||
               [[ "$lower_name" == *audit* ]] ||
               [[ "$lower_name" == *kill* ]] ||
               [[ "$lower_name" == *control* ]] ||
               [[ "$lower_name" == *accessibilityservice* ]] ||
               [[ "$lower_name" == *deviceactionexecutor* ]] ||
               [[ "$lower_name" == *voiceforegroundservice* ]] ||
               [[ "$lower_name" == *selfmodification* ]] ||
               [[ "$lower_name" == *update* ]] ||
               [[ "$lower_name" == *signing* ]] ||
               [[ "$lower_name" == *keystore* ]] ||
               [[ "$lower_name" == *uibundle* ]] ||
               [[ "$lower_name" == *shizuku* ]]; then
              echo "Blocked policy-critical change in self-proposal: $path"
              exit 1
            fi
          done <<< "$changed"
      - name: Set CI version code
        shell: bash
        run: |
          set -euo pipefail
          VERSION_CODE="$GITHUB_RUN_NUMBER"
          [[ "$VERSION_CODE" =~ ^[1-9][0-9]*$ ]] && (( VERSION_CODE <= 2100000000 )) || { echo "GITHUB_RUN_NUMBER is outside Android versionCode range"; exit 1; }
          echo "ANDROID_VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"
          echo "ANDROID_VERSION_NAME=0.3.1-ci.$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"
      - name: Unit tests and release-signed APK
        run: gradle testDebugUnitTest assembleRelease --no-daemon
      - name: Verify fixed release certificate and package APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p output
          APK="output/vyom-phase6-${GITHUB_SHA}.apk"
          cp app/build/outputs/apk/release/app-release.apk "$APK"
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          APKSIGNER="$(find "$SDK_ROOT/build-tools" -type f -name apksigner 2>/dev/null | sort -V | tail -n 1)"
          test -n "$APKSIGNER" || { echo "apksigner not found"; exit 1; }
          "$APKSIGNER" verify --verbose --print-certs "$APK" > "$APK.certs.txt" 2>&1
          CERT_SHA256="$(grep -i 'SHA-256' "$APK.certs.txt" | grep -Eo '[[:xdigit:]]{64}' | head -n 1 | tr '[:upper:]' '[:lower:]')"
          [[ "$CERT_SHA256" =~ ^[a-f0-9]{64}$ ]] || { echo "Could not extract signing certificate SHA-256 fingerprint"; exit 1; }
          EXPECTED_CERT_SHA256="$(tr -d '[:space:]' < config/release-certificate.sha256 | tr '[:upper:]' '[:lower:]')"
          [[ "$EXPECTED_CERT_SHA256" =~ ^[a-f0-9]{64}$ ]] || { echo "Fixed release identity file is invalid"; exit 1; }
          [[ "$CERT_SHA256" == "$EXPECTED_CERT_SHA256" ]] || { echo "Fixed release identity mismatch; artifact upload blocked."; exit 1; }
          echo "Signing certificate SHA-256: $CERT_SHA256"
          echo "Signing certificate SHA-256 matches the fixed release identity."
          (cd output && sha256sum "vyom-phase6-${GITHUB_SHA}.apk") > "output/vyom-phase6-${GITHUB_SHA}.apk.sha256"
          printf 'versionName=%s\nversionCode=%s\ncommit=%s\nsha256=%s\ncertificateSha256=%s\n' "$ANDROID_VERSION_NAME" "$ANDROID_VERSION_CODE" "$GITHUB_SHA" "$(cut -d ' ' -f 1 "output/vyom-phase6-${GITHUB_SHA}.apk.sha256")" "$CERT_SHA256" > output/build-info.txt
      - name: Upload release-signed APK
        uses: actions/upload-artifact@v4
        with:
          name: vyom-phase6-${{ github.sha }}
          path: output/*
          if-no-files-found: error
          retention-days: 30
